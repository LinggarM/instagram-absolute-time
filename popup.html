<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; color: #262626; }
    .row { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    select { width: 100%; padding: 6px; border: 1px solid #dbdbdb; border-radius: 4px; background: #fff; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .toggle-row label { margin-bottom: 0; }
    #status { font-size: 12px; color: #0095f6; text-align: center; height: 16px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="toggle-row">
    <label for="isActive">Aktifkan Ekstensi</label>
    <input type="checkbox" id="isActive">
  </div>

  <div class="row">
    <label for="timezone">Zona Waktu</label>
    <select id="timezone">
      <option value="Asia/Jakarta">WIB (Asia/Jakarta)</option>
      <option value="Asia/Makassar">WITA (Asia/Makassar)</option>
      <option value="Asia/Jayapura">WIT (Asia/Jayapura)</option>
      <option value="local">Lokal Browser</option>
    </select>
  </div>

  <div class="row">
    <label for="dateFormat">Format Tanggal</label>
    <select id="dateFormat">
      <option value="default">Default (16 Nov 2026, 12.18)</option>
      <option value="iso">ISO (2026-11-16 12:18)</option>
      <option value="short">Pendek (16/11/2026)</option>
    </select>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
